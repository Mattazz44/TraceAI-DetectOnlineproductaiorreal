<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7F5" id="meta-theme-color" />
    <title>TraceAI: Pemeriksaan Keaslian Gambar Produk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('traceai:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          var meta = document.getElementById('meta-theme-color')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0E1210' : '#F6F7F5')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
